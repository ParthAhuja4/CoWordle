<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="color-scheme" content="dark" />
  <title>CoWordle</title>
  <link rel="stylesheet" href="style.css" />
  <script src="config.js"></script>
</head>
<body>
  <div id="app">
    <section id="screen-loading" class="screen">
      <div class="logo">Co<span>Wordle</span></div>
      <p id="loading-text">Connecting to Discord…</p>
      <p id="loading-error" class="error" hidden></p>
    </section>

    <section id="screen-lobby" class="screen" hidden>
      <header class="lobby-head">
        <div class="logo small">Co<span>Wordle</span></div>
        <div id="lobby-score" class="score-line" hidden></div>
      </header>
      <div class="lobby-body">
        <div class="players">
          <h2>Players <span id="lobby-count"></span></h2>
          <ul id="lobby-players"></ul>
          <p class="hint">Invite friends to this Activity. Everyone who opens it from this channel joins the room.</p>
        </div>
        <div class="settings">
          <h2>Mode</h2>
          <div class="seg" id="mode-picker">
            <button data-mode="duel" class="seg-btn">⚔️ Duel</button>
            <button data-mode="turn" class="seg-btn">🎮 Turn-by-Turn</button>
          </div>
          <p id="mode-desc" class="desc"></p>
          <div id="turns-row" class="turns-row" hidden>
            <span>Turns each</span>
            <div class="seg" id="turns-picker">
              <button data-turns="1" class="seg-btn">1</button>
              <button data-turns="2" class="seg-btn">2</button>
              <button data-turns="3" class="seg-btn">3</button>
            </div>
          </div>
        </div>
      </div>
      <footer class="lobby-foot">
        <button id="start-btn" class="primary">Start game</button>
        <p id="lobby-wait" class="hint" hidden></p>
      </footer>
    </section>

    <section id="screen-game" class="screen" hidden>
      <header class="game-head">
        <div id="score-chips" class="chips"></div>
        <div id="round-label" class="round-label"></div>
      </header>
      <div id="status" class="status"></div>
      <div class="timer"><div id="timer-fill" class="timer-fill"></div></div>
      <div id="boards" class="boards"></div>
      <div id="overlay" class="overlay" hidden></div>
      <div id="keyboard" class="keyboard"></div>
      <footer class="game-foot">
        <button id="forfeit-btn" class="ghost" hidden>Forfeit round</button>
      </footer>
    </section>

    <div id="toasts" class="toasts"></div>
  </div>
  <script src="app.js"></script>
</body>
</html>
